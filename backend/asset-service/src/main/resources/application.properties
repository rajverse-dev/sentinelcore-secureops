spring.application.name=asset-service

spring.application.name=sentinelcore-auth

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/sentinelcore
spring.datasource.username=postgres
spring.datasource.password=121006

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=change-this-to-a-long-random-secret-key-for-development
jwt.expiration=86400000

# SonarQube
# Configure via environment-specific properties or environment variables.
sonarqube.base-url=${SONARQUBE_BASE_URL:}
sonarqube.token=${SONARQUBE_TOKEN:}

# Trivy Scanner
# Configure via environment-specific properties or environment variables.
trivy.executable=${TRIVY_EXECUTABLE:trivy}
trivy.timeout-seconds=${TRIVY_TIMEOUT_SECONDS:60}
trivy.default-target=${TRIVY_DEFAULT_TARGET:alpine:latest}

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=sentinelcore-audit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
sentinelcore.kafka.enabled=${KAFKA_ENABLED:true}
sentinelcore.kafka.topic=sentinelcore-audit-events

