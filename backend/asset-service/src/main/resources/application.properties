spring.application.name=sentinelcore-backend

server.port=${PORT:8080}

# PostgreSQL Database (Configured for Azure & Local Dev)
spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sentinelcore}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:121006}}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Authentication
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-for-development}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Configuration for Vercel and Local Development
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:https://*.vercel.app,https://*.azurewebsites.net}

# Actuator Health Check for Azure App Service probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# SonarQube
sonarqube.base-url=${SONARQUBE_BASE_URL:}
sonarqube.token=${SONARQUBE_TOKEN:}

# Trivy Scanner
trivy.executable=${TRIVY_EXECUTABLE:trivy}
trivy.timeout-seconds=${TRIVY_TIMEOUT_SECONDS:60}
trivy.default-target=${TRIVY_DEFAULT_TARGET:alpine:latest}
