spring.application.name=sentinelcore-auth

server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sentinelcore}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-for-development-only}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Configure the deployed Vercel origin in Azure as a comma-separated exact-origin allowlist.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}

# SonarQube
# Configure via environment-specific properties or environment variables.
sonarqube.base-url=${SONARQUBE_BASE_URL:}
sonarqube.token=${SONARQUBE_TOKEN:}

# Trivy Scanner
# Configure via environment-specific properties or environment variables.
trivy.executable=${TRIVY_EXECUTABLE:trivy}
trivy.timeout-seconds=${TRIVY_TIMEOUT_SECONDS:60}
trivy.default-target=${TRIVY_DEFAULT_TARGET:alpine:latest}
